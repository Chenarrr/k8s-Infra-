name: Helm Chart CI

on:
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Install helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false

      - name: Lint chart
        run: |
          make lint

      - name: Run tests
        run: |
          make test

      - name: Install helm-docs
        run: |
          GO111MODULE=on go install github.com/norwoodj/helm-docs/cmd/helm-docs@latest

      - name: Generate docs with helm-docs
        run: |
          make docs
          echo "helm-docs documentation generated successfully"

