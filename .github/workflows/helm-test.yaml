name: Helm Chart CI

on:
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Install helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false

      - name: Lint chart
        run: |
          cd charts/notes-app
          helm lint .

      - name: Run tests
        run: |
          cd charts/notes-app
          helm unittest .

      - name: Install Frigate
        run: |
          pip3 install frigate

      - name: Generate docs with Frigate  
        run: |
          python3 -m frigate gen charts/notes-app > chart-docs.md
          # Update the main README with chart documentation
          echo "Frigate documentation generated successfully"