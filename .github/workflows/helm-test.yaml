name: Helm Chart CI

on:
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Install helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false

      - name: Lint chart
        run: |
          make lint

      - name: Run tests
        run: |
          make test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bitnami readme-generator-for-helm
        run: |
          npm install --global github:bitnami/readme-generator-for-helm

      - name: Generate docs with Bitnami readme-generator-for-helm
        run: |
          make docs
          echo "Bitnami readme-generator-for-helm documentation generated successfully"
