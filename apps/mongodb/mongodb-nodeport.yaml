apiVersion: v1
kind: Service
metadata:
  name: mongodb-nodeport
  namespace: notes-app
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: notes-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      nodePort: 32017
