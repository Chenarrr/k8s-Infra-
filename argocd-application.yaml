apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noteapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Chenarrr/k8s-Infra-.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: noteapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true


      