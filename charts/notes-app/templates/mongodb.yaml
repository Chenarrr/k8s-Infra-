{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  labels:
{{ toYaml .Values.mongodb.labels | indent 4 }}
spec:
  storageClassName: {{ .Values.mongodb.storage.storageClassName }}
  capacity:
    storage: {{ .Values.mongodb.storage.size }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.mongodb.storage.hostPath | quote }}
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  labels:
{{ toYaml .Values.mongodb.labels | indent 4 }}
spec:
  storageClassName: {{ .Values.mongodb.storage.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongodb.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongodb.serviceName }}
  labels:
{{ toYaml .Values.mongodb.labels | indent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ index .Values.mongodb.labels "app.kubernetes.io/name" }}
  ports:
    - port: {{ .Values.mongodb.containerPort }}
      targetPort: {{ .Values.mongodb.containerPort }}
      name: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.mongodb.name }}
  labels:
{{ toYaml .Values.mongodb.labels | indent 4 }}
spec:
  serviceName: {{ .Values.mongodb.serviceName }}
  replicas: {{ .Values.mongodb.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ index .Values.mongodb.labels "app.kubernetes.io/name" }}
  template:
    metadata:
      labels:
{{ toYaml .Values.mongodb.labels | indent 8 }}
    spec:
      containers:
        - name: {{ .Values.mongodb.name }}
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          ports:
            - containerPort: {{ .Values.mongodb.containerPort }}
              name: mongodb
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: {{ .Values.mongodb.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mongodb.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mongodb.readinessProbe.timeoutSeconds }}
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: {{ .Values.mongodb.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mongodb.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mongodb.livenessProbe.timeoutSeconds }}
          resources:
{{ toYaml .Values.mongodb.resources | indent 12 }}
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
{{- end }}
