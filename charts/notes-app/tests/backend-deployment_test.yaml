suite: Backend Deployment
templates:
  - backend.yaml
tests:
  # ── Rendering & Kind ──────────────────────────────────────────────
  - it: should render a Deployment when enabled
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 0
      - isAPIVersion:
          of: apps/v1
        documentIndex: 0

  - it: should not render anything when backend is disabled
    set:
      backend.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ── Metadata ──────────────────────────────────────────────────────
  - it: should have correct deployment name
    asserts:
      - equal:
          path: metadata.name
          value: backend
        documentIndex: 0

  - it: should include standard Helm labels
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
        documentIndex: 0
      - exists:
          path: metadata.labels["app.kubernetes.io/managed-by"]
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: backend
        documentIndex: 0

  # ── Replicas ──────────────────────────────────────────────────────
  - it: should default to 1 replica
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 0

  - it: should allow overriding replica count
    set:
      backend.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
        documentIndex: 0

  # ── Selector / Pod labels match ───────────────────────────────────
  - it: should have matching selector and pod labels
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: backend
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: backend
        documentIndex: 0

  # ── Container Image ───────────────────────────────────────────────
  - it: should use the correct image and pull policy
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "chenarrr/devops:backend-a725016"
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
        documentIndex: 0

  - it: should allow overriding image tag
    set:
      backend.image.tag: v2.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "chenarrr/devops:v2.0.0"
        documentIndex: 0

  # ── Container Port ────────────────────────────────────────────────
  - it: should expose the correct container port
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5000
        documentIndex: 0

  # ── Environment Variables ─────────────────────────────────────────
  - it: should set MONGODB_URI env var
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGODB_URI
            value: "mongodb://mongodb-0.mongodb-service:27017/notes-app"
        documentIndex: 0

  - it: should set NODE_ENV to production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_ENV
            value: "production"
        documentIndex: 0

  - it: should allow overriding MONGODB_URI
    set:
      backend.env.mongodbUri: mongodb://custom-host:27017/mydb
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGODB_URI
            value: "mongodb://custom-host:27017/mydb"
        documentIndex: 0

  # ── Init Container (wait-for-mongodb) ─────────────────────────────
  - it: should have a wait-for-mongodb init container
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-mongodb
        documentIndex: 0
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "busybox:1.36"
        documentIndex: 0

  # ── Readiness Probe ───────────────────────────────────────────────
  - it: should configure readiness probe correctly
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/notes
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 5000
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 30
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 10
        documentIndex: 0

  # ── Liveness Probe ────────────────────────────────────────────────
  - it: should configure liveness probe correctly
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/notes
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 5000
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 120
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 60
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 30
        documentIndex: 0

  # ── Pod Security Context ──────────────────────────────────────────
  - it: should run as non-root user
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
        documentIndex: 0
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
        documentIndex: 0

  # ── Container Security Context ────────────────────────────────────
  - it: should disallow privilege escalation
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
        documentIndex: 0

  # ── Resource Requests & Limits ────────────────────────────────────
  - it: should set resource requests
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 64Mi
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m
        documentIndex: 0

  - it: should set resource limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 200m
        documentIndex: 0

  - it: should allow overriding resource limits
    set:
      backend.resources.limits.memory: 512Mi
      backend.resources.limits.cpu: 500m
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
        documentIndex: 0

  # ── Node Selector ─────────────────────────────────────────────────
  - it: should set nodeSelector for worker nodes
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["node-role.kubernetes.io/worker"]
          value: ""
        documentIndex: 0

  - it: should allow overriding nodeSelector
    set:
      backend.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
        documentIndex: 0

  - it: should omit nodeSelector when set to null
    set:
      backend.nodeSelector: null
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
        documentIndex: 0
