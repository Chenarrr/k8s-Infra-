## @section Common parameters
## @param fullnameOverride Override the full release name.
fullnameOverride: notes-app

## @section Backend parameters
backend:
  ## @param backend.enabled Enable backend deployment.
  enabled: true
  ## @param backend.name Backend component name.
  name: backend
  ## @param backend.replicaCount Number of backend replicas.
  replicaCount: 1
  image:
    ## @param backend.image.repository Image repository.
    repository: chenarrr/devops
    ## @param backend.image.tag Image tag.
    tag: backend-a725016
    ## @param backend.image.pullPolicy Image pull policy.
    pullPolicy: Always
  ## @param backend.containerPort Backend container port.
  containerPort: 5000
  ## @extra backend.service Backend service configuration.
  service:
    ## @param backend.service.type Service type.
    type: ClusterIP
    ## @param backend.service.port Service port.
    port: 5000
  env:
    ## @param backend.env.mongodbUri MongoDB connection URI.
    mongodbUri: mongodb://mongodb-0.mongodb-service:27017/notes-app
    ## @param backend.env.nodeEnv Node environment.
    nodeEnv: production
  podSecurityContext:
    ## @param backend.podSecurityContext.runAsNonRoot Run as non-root user.
    runAsNonRoot: true
    ## @param backend.podSecurityContext.runAsUser User ID for the container process.
    runAsUser: 1000
    ## @param backend.podSecurityContext.fsGroup File system group ID.
    fsGroup: 1000
  securityContext:
    ## @param backend.securityContext.allowPrivilegeEscalation Allow privilege escalation.
    allowPrivilegeEscalation: false
    ## @param backend.securityContext.readOnlyRootFilesystem Mount root filesystem as read-only.
    readOnlyRootFilesystem: false
  resources:
    requests:
      ## @param backend.resources.requests.memory Requested memory.
      memory: 128Mi
      ## @param backend.resources.requests.cpu Requested CPU.
      cpu: 100m
    ## @extra backend.resources.limits Backend resource limits.
    limits:
      ## @param backend.resources.limits.memory Memory limit.
      memory: 256Mi
      ## @param backend.resources.limits.cpu CPU limit.
      cpu: 200m
  readinessProbe:
    ## @param backend.readinessProbe.path Readiness endpoint path.
    path: /api/notes
    ## @param backend.readinessProbe.initialDelaySeconds Initial delay before readiness checks.
    initialDelaySeconds: 30
    ## @param backend.readinessProbe.periodSeconds Readiness check interval.
    periodSeconds: 10
    ## @param backend.readinessProbe.timeoutSeconds Readiness check timeout.
    timeoutSeconds: 10
  livenessProbe:
    ## @param backend.livenessProbe.path Liveness endpoint path.
    path: /api/notes
    ## @param backend.livenessProbe.initialDelaySeconds Initial delay before liveness checks.
    initialDelaySeconds: 120
    ## @param backend.livenessProbe.periodSeconds Liveness check interval.
    periodSeconds: 60
    ## @param backend.livenessProbe.timeoutSeconds Liveness check timeout.
    timeoutSeconds: 30

## @section Frontend parameters
frontend:
  ## @param frontend.enabled Enable frontend deployment.
  enabled: true
  ## @param frontend.name Frontend component name.
  name: frontend
  ## @param frontend.replicaCount Number of frontend replicas.
  replicaCount: 1
  image:
    ## @param frontend.image.repository Image repository.
    repository: chenarrr/devops
    ## @param frontend.image.tag Image tag.
    tag: frontend-a725016
    ## @param frontend.image.pullPolicy Image pull policy.
    pullPolicy: Always
  ## @param frontend.containerPort Frontend container port.
  containerPort: 80
  service:
    ## @param frontend.service.type Service type.
    type: ClusterIP
    ## @param frontend.service.port Service port.
    port: 80
  resources:
    requests:
      ## @param frontend.resources.requests.memory Requested memory.
      memory: 64Mi
      ## @param frontend.resources.requests.cpu Requested CPU.
      cpu: 50m
    limits:
      ## @param frontend.resources.limits.memory Memory limit.
      memory: 128Mi
      ## @param frontend.resources.limits.cpu CPU limit.
      cpu: 100m
  securityContext:
    ## @param frontend.securityContext.allowPrivilegeEscalation Allow privilege escalation.
    allowPrivilegeEscalation: false
  readinessProbe:
    ## @param frontend.readinessProbe.path Readiness endpoint path.
    path: /
    ## @param frontend.readinessProbe.initialDelaySeconds Initial delay before readiness checks.
    initialDelaySeconds: 5
    ## @param frontend.readinessProbe.periodSeconds Readiness check interval.
    periodSeconds: 10
    ## @param frontend.readinessProbe.timeoutSeconds Readiness check timeout.
    timeoutSeconds: 3
  livenessProbe:
    ## @param frontend.livenessProbe.path Liveness endpoint path.
    path: /
    ## @param frontend.livenessProbe.initialDelaySeconds Initial delay before liveness checks.
    initialDelaySeconds: 30
    ## @param frontend.livenessProbe.periodSeconds Liveness check interval.
    periodSeconds: 60
    ## @param frontend.livenessProbe.timeoutSeconds Liveness check timeout.
    timeoutSeconds: 10

## @section MongoDB parameters
mongodb:
  ## @param mongodb.enabled Enable MongoDB StatefulSet.
  enabled: true
  ## @param mongodb.name MongoDB component name.
  name: mongodb
  ## @param mongodb.serviceName Headless service name for StatefulSet DNS.
  serviceName: mongodb-service
  ## @param mongodb.replicaCount Number of MongoDB replicas.
  replicaCount: 1
  image:
    ## @param mongodb.image.repository Image repository.
    repository: mongo
    ## @param mongodb.image.tag Image tag.
    tag: "8"
  ## @param mongodb.containerPort MongoDB container port.
  containerPort: 27017
  storage:
    ## @param mongodb.storage.storageClassName Storage class name.
    storageClassName: manual
    ## @param mongodb.storage.size Volume size.
    size: 5Gi
    ## @param mongodb.storage.hostPath Host path for local storage.
    hostPath: /mnt/data/mongodb
  resources:
    requests:
      ## @param mongodb.resources.requests.memory Requested memory.
      memory: 256Mi
      ## @param mongodb.resources.requests.cpu Requested CPU.
      cpu: 100m
    limits:
      ## @param mongodb.resources.limits.memory Memory limit.
      memory: 512Mi
      ## @param mongodb.resources.limits.cpu CPU limit.
      cpu: 200m
  readinessProbe:
    ## @param mongodb.readinessProbe.initialDelaySeconds Initial delay before readiness checks.
    initialDelaySeconds: 30
    ## @param mongodb.readinessProbe.periodSeconds Readiness check interval.
    periodSeconds: 10
    ## @param mongodb.readinessProbe.timeoutSeconds Readiness check timeout.
    timeoutSeconds: 10
  livenessProbe:
    ## @param mongodb.livenessProbe.initialDelaySeconds Initial delay before liveness checks.
    initialDelaySeconds: 120
    ## @param mongodb.livenessProbe.periodSeconds Liveness check interval.
    periodSeconds: 60
    ## @param mongodb.livenessProbe.timeoutSeconds Liveness check timeout.
    timeoutSeconds: 30

## @section Ingress parameters
ingress:
  ## @param ingress.enabled Enable Ingress resource.
  enabled: true
  ## @param ingress.name Ingress resource name.
  name: notes-app-ingress
  annotations:
    ## @param ingress.annotations.nginx.ingress.kubernetes.io/proxy-body-size Set max body size for NGINX ingress.
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  ## @param ingress.className Ingress class name.
  className: nginx
  ## @param ingress.path Ingress path.
  path: /
  ## @param ingress.pathType Ingress path type.
  pathType: Prefix
