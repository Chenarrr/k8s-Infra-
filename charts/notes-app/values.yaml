nameOverride: ""
fullnameOverride: notes-app

backend:
  enabled: true
  name: backend
  replicaCount: 1
  image:
    repository: chenarrr/devops
    tag: backend-8193810
    pullPolicy: Always
  containerPort: 5000
  service:
    type: ClusterIP
    port: 5000
  env:
    mongodbUri: mongodb://mongodb-0.mongodb-service:27017/notes-app
    nodeEnv: production
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  resources:
    requests:
      memory: 192Mi
      cpu: 150m
    limits:
      memory: 384Mi
      cpu: 300m
  readinessProbe:
    path: /api/notes
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
  livenessProbe:
    path: /api/notes
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10

frontend:
  enabled: true
  name: frontend
  replicaCount: 1
  image:
    repository: chenarrr/devops
    tag: frontend-8193810
    pullPolicy: Always
  containerPort: 80
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  securityContext:
    allowPrivilegeEscalation: false
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
  livenessProbe:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 3

mongodb:
  enabled: true
  name: mongodb
  serviceName: mongodb-service
  replicaCount: 1
  image:
    repository: mongo
    tag: "8"
  containerPort: 27017
  storage:
    storageClassName: manual
    size: 5Gi
    hostPath: /mnt/data/mongodb
  resources:
    requests:
      memory: 384Mi
      cpu: 150m
    limits:
      memory: 768Mi
      cpu: 300m
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 10
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10

ingress:
  enabled: true
  name: notes-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  className: nginx
  path: /
  pathType: Prefix