apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notes-app
  namespace: flux-system
spec:
  interval: 1m
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: notes-app
  patches:
  - patch: |
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      metadata:
        name: not-used
      resources:
      - namespace.yaml
      - backend/
      - frontend/
      - mongodb/
      - ingress.yaml